name: VM4 CI sibling upload ordering

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-a:
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.9.10.1
      - name: Upload fast A/A marker
        env:
          MERGIFY_TOKEN: ${{ secrets.VM4_TRACE_PARENT_BINDING_20260916 }}
        shell: bash
        run: |
          cat > report.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="0">
            <testsuite name="vm4-sibling-order" tests="1" failures="0">
              <testcase classname="vm4.sibling.order" name="VM4_SIBLING_FAST_FIRST_20260916"/>
            </testsuite>
          </testsuites>
          XML
          mergify ci junit-process --repository vm4-mergify-org-a91c37/config-precedence-lab report.xml

  slow-a:
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.9.10.1
      - name: Upload delayed A/A marker
        env:
          MERGIFY_TOKEN: ${{ secrets.VM4_TRACE_PARENT_BINDING_20260916 }}
        shell: bash
        run: |
          sleep 10
          cat > report.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="0">
            <testsuite name="vm4-sibling-order" tests="1" failures="0">
              <testcase classname="vm4.sibling.order" name="VM4_SIBLING_SLOW_SECOND_20260916"/>
            </testsuite>
          </testsuites>
          XML
          mergify ci junit-process --repository vm4-mergify-org-a91c37/config-precedence-lab report.xml
