merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: auto-main
    queue_conditions:
      - base = main
      - label = vm4-migrate-auto-a
    merge_conditions:
      - label = vm4-never-merge
    merge_method: merge
  - name: auto-release
    queue_conditions:
      - base = release
      - label = vm4-migrate-auto-b
    merge_conditions:
      - label = vm4-never-merge
    merge_method: merge
  - name: manual-main
    queue_conditions:
      - base = main
      - label = vm4-manual-only
    merge_conditions:
      - label = vm4-never-merge
    merge_method: merge
merge_protections_settings:
# auto_merge_conditions reflects the queue_conditions of the queue rules that previously had autoqueue: true. The following queue rules were manual-only ('manual-main') and remain reachable via the `/queue` command. Review and adjust if needed.
  auto_merge_conditions:
    - or:
        - and:
            - base = main
            - label = vm4-migrate-auto-a
        - and:
            - base = release
            - label = vm4-migrate-auto-b
